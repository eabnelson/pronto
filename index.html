<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <meta
      name="description"
      content="Pick any tag. Message Codex or Claude from any iMessage conversation."
    >
    <title>s4imsg — iMessage Codex or Claude Code</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background:
          radial-gradient(circle at 50% 42%, #ffffff 0, #ffffff 13rem, transparent 38rem),
          #f5f5f7;
      }

      main {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100vh;
        padding: 2rem 1rem;
        place-items: center;
        text-align: center;
      }

      .hero {
        position: relative;
        width: min(100%, 58rem);
        padding: clamp(2.5rem, 7vw, 5.5rem) 1rem;
        isolation: isolate;
      }

      .hero::before {
        position: absolute;
        z-index: -1;
        inset: -5rem -8rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 97%) 0 30%, rgb(255 255 255 / 78%) 48%, transparent 72%);
        content: "";
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 10vw, 7.5rem);
        font-weight: 740;
        letter-spacing: -0.075em;
        line-height: 0.9;
      }

      .subhead {
        max-width: 30ch;
        margin: 1.4rem auto 0;
        color: #656569;
        font-size: clamp(1.25rem, 3vw, 1.85rem);
        font-weight: 470;
        letter-spacing: -0.035em;
        line-height: 1.25;
      }

      .cta {
        display: inline-flex;
        min-width: 13rem;
        min-height: 3.6rem;
        margin-top: 1.75rem;
        padding: 0 1.6rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: #0a84ff;
        box-shadow: 0 0.9rem 2.6rem rgb(10 132 255 / 24%);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 660;
        letter-spacing: -0.015em;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .cta:hover {
        background: #0077ed;
        box-shadow: 0 1rem 3rem rgb(10 132 255 / 30%);
        transform: translateY(-2px);
      }

      .cta:active {
        transform: translateY(0);
      }

      .cta:focus-visible {
        outline: 4px solid rgb(10 132 255 / 28%);
        outline-offset: 4px;
      }

      .cta[data-copied="true"] {
        background: #20a957;
        box-shadow: 0 0.9rem 2.6rem rgb(32 169 87 / 22%);
      }

      .bubble-stream {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .stream-bubble {
        position: absolute;
        left: var(--left);
        bottom: -8rem;
        max-width: min(80vw, 29rem);
        padding: 0.72rem 1rem;
        border-radius: 999px;
        box-shadow: 0 0.8rem 2rem rgb(0 0 0 / 10%);
        font-size: clamp(0.9rem, 1.7vw, 1.08rem);
        font-weight: 520;
        letter-spacing: -0.018em;
        line-height: 1.25;
        opacity: 0;
        white-space: nowrap;
        animation: rise var(--duration) linear var(--delay) forwards;
        will-change: transform, opacity;
      }

      .stream-bubble.blue {
        background: #0a84ff;
        color: white;
      }

      .stream-bubble.gray {
        background: #e5e5ea;
        color: #1d1d1f;
      }

      @keyframes rise {
        0% {
          opacity: 0;
          transform: translate3d(0, 10vh, 0) rotate(var(--rotation));
        }

        9% {
          opacity: 0.82;
        }

        82% {
          opacity: 0.72;
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--drift), -128vh, 0)
            rotate(calc(var(--rotation) + var(--spin)));
        }
      }

      @media (max-width: 620px) {
        .hero {
          padding-right: 0;
          padding-left: 0;
        }

        .hero::before {
          right: -4rem;
          left: -4rem;
        }

        h1 {
          font-size: clamp(3.25rem, 17vw, 5rem);
        }

        .subhead {
          max-width: 23ch;
          margin-top: 1.15rem;
        }

        .cta {
          margin-top: 1.5rem;
        }

        .stream-bubble {
          max-width: 88vw;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }

        .stream-bubble {
          animation: none;
        }

        .stream-bubble[data-static="true"] {
          top: var(--top);
          bottom: auto;
          opacity: 0.22;
          transform: rotate(var(--rotation));
        }
      }
    </style>
  </head>
  <body>
    <div class="bubble-stream" data-bubble-stream aria-hidden="true"></div>

    <main>
      <section class="hero" aria-labelledby="headline">
        <h1 id="headline">Pick any tag</h1>
        <p class="subhead">Message Codex or Claude from any conversation</p>
        <a class="cta" id="copy-prompt" href="./setup.md" aria-live="polite">Help me set up s4imsg</a>
      </section>
    </main>

    <script>
      const setupPrompt =
        "Help me set up s4imsg: https://eabnelson.github.io/s4imsg/setup.md";
      const promptExamples = [
        "@codex fix these failing tests",
        "@claude summarize this thread",
        "@plan map out our weekend",
        "@ship draft the launch post",
        "@research compare these options",
        "@coach build me a 20-minute workout",
        "@design sketch a cleaner flow",
        "@dinner find a great spot nearby",
        "@learn explain this like I'm five",
        "@build turn this idea into a prototype",
        "@travel plan three days in Tokyo",
        "@read pull out the action items",
      ];

      const stream = document.querySelector("[data-bubble-stream]");
      const copyButton = document.querySelector("#copy-prompt");
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      let reducedMotion = motionPreference.matches;
      let promptIndex = 0;
      let streamTimer;
      let copyAttempt = 0;

      function positionBubble(bubble) {
        const gutter = 12;
        const maxLeft = Math.max(gutter, window.innerWidth - bubble.offsetWidth - gutter);
        const left = gutter + Math.random() * (maxLeft - gutter);
        bubble.style.setProperty("--left", `${left}px`);
      }

      function scheduleNextBubble(delay = 850) {
        if (reducedMotion || document.hidden || streamTimer || stream.childElementCount >= 18) {
          return;
        }

        streamTimer = window.setTimeout(() => {
          streamTimer = undefined;
          createBubble();
          scheduleNextBubble();
        }, delay);
      }

      function createBubble({ seed = false, staticBubble = false } = {}) {
        if (stream.childElementCount >= 18) return;

        const bubble = document.createElement("span");
        const rotation = -16 + Math.random() * 32;

        bubble.className = `stream-bubble ${Math.random() > 0.48 ? "blue" : "gray"}`;
        bubble.textContent = promptExamples[promptIndex % promptExamples.length];
        bubble.style.setProperty("--rotation", `${rotation}deg`);
        promptIndex += 1;

        if (staticBubble) {
          bubble.dataset.static = "true";
          bubble.style.setProperty("--top", `${5 + Math.random() * 88}vh`);
        } else {
          const duration = 12 + Math.random() * 8;
          bubble.style.setProperty("--duration", `${duration}s`);
          bubble.style.setProperty("--delay", seed ? `${-Math.random() * duration}s` : "0s");
          bubble.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          bubble.style.setProperty("--spin", `${-8 + Math.random() * 16}deg`);
          bubble.addEventListener(
            "animationend",
            () => {
              bubble.remove();
              scheduleNextBubble();
            },
            { once: true },
          );
        }

        stream.append(bubble);
        positionBubble(bubble);
      }

      function initializeBubbleStream() {
        if (reducedMotion) {
          for (let index = 0; index < 8; index += 1) createBubble({ staticBubble: true });
          return;
        }

        for (let index = 0; index < 12; index += 1) createBubble({ seed: true });
        scheduleNextBubble();
      }

      function resetBubbleStream(nextReducedMotion) {
        window.clearTimeout(streamTimer);
        streamTimer = undefined;
        stream.replaceChildren();
        reducedMotion = nextReducedMotion;
        initializeBubbleStream();
      }

      initializeBubbleStream();
      motionPreference.addEventListener("change", (event) => resetBubbleStream(event.matches));
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          window.clearTimeout(streamTimer);
          streamTimer = undefined;
        } else {
          scheduleNextBubble();
        }
      });

      async function copySetupPrompt(event) {
        event.preventDefault();
        const attempt = ++copyAttempt;
        delete copyButton.dataset.copied;
        copyButton.textContent = "Copying prompt…";

        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(setupPrompt);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = setupPrompt;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();
            const copied = document.execCommand("copy");
            textarea.remove();
            if (!copied) throw new Error("copy failed");
          }

          if (attempt === copyAttempt) {
            copyButton.textContent = "Copied prompt";
            copyButton.dataset.copied = "true";
          }
        } catch {
          if (attempt === copyAttempt) {
            delete copyButton.dataset.copied;
            copyButton.textContent = "Opening setup guide…";
            window.location.assign(copyButton.href);
          }
        }
      }

      copyButton.addEventListener("click", copySetupPrompt);
    </script>
  </body>
</html>
