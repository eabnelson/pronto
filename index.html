<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <meta
      name="description"
      content="Pick a tag and message Codex or Claude Code from any iMessage conversation."
    >
    <title>s4imsg — iMessage Codex or Claude Code</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -20%, #ffffff 0, #ffffff 26rem, transparent 48rem),
          #f5f5f7;
      }

      main {
        width: min(100% - 2rem, 70rem);
        margin: 0 auto;
        padding: clamp(3.5rem, 9vw, 7.5rem) 0 4rem;
        text-align: center;
      }

      .mark {
        display: inline-grid;
        width: 3.25rem;
        height: 3.25rem;
        margin-bottom: 1.75rem;
        place-items: center;
        border-radius: 1.05rem;
        background: #0a84ff;
        box-shadow: 0 0.75rem 2rem rgb(10 132 255 / 24%);
        color: white;
        font-size: 1.05rem;
        font-weight: 750;
        letter-spacing: -0.04em;
      }

      h1 {
        max-width: 14ch;
        margin: 0 auto;
        font-size: clamp(2.7rem, 7vw, 5.7rem);
        font-weight: 720;
        letter-spacing: -0.065em;
        line-height: 0.96;
      }

      .subhead {
        max-width: 35rem;
        margin: 1.4rem auto 0;
        color: #6e6e73;
        font-size: clamp(1.15rem, 2.5vw, 1.55rem);
        letter-spacing: -0.025em;
        line-height: 1.35;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
        max-width: 54rem;
        margin: clamp(3rem, 8vw, 5rem) auto 0;
      }

      .thread {
        min-height: 25rem;
        padding: 1.1rem 1.1rem 1.4rem;
        overflow: hidden;
        border: 1px solid rgb(0 0 0 / 7%);
        border-radius: 2rem;
        background: rgb(255 255 255 / 84%);
        box-shadow: 0 1.5rem 4.5rem rgb(0 0 0 / 8%);
        backdrop-filter: blur(1.25rem);
      }

      .thread-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 4.2rem;
        border-bottom: 1px solid #ececee;
      }

      .avatar {
        display: grid;
        width: 2.25rem;
        height: 2.25rem;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #d8d8dc, #f2f2f4);
        color: #707075;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .messages {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 19rem;
        gap: 0.9rem;
        padding: 1rem 0.4rem;
      }

      .bubble {
        position: relative;
        width: fit-content;
        max-width: 84%;
        margin: 0;
        padding: 0.68rem 0.95rem;
        border-radius: 1.2rem;
        font-size: clamp(1rem, 2vw, 1.16rem);
        letter-spacing: -0.015em;
        line-height: 1.28;
        text-align: left;
      }

      .bubble.incoming {
        align-self: flex-start;
        background: #e9e9eb;
        color: #111113;
        border-bottom-left-radius: 0.35rem;
      }

      .bubble.outgoing {
        align-self: flex-end;
        background: #0a84ff;
        color: white;
        border-bottom-right-radius: 0.35rem;
      }

      .bubble.incoming::after,
      .bubble.outgoing::after {
        position: absolute;
        bottom: -0.18rem;
        width: 0.7rem;
        height: 0.7rem;
        content: "";
        background: inherit;
      }

      .bubble.incoming::after {
        left: -0.1rem;
        border-bottom-left-radius: 0.7rem;
        transform: skew(-28deg);
      }

      .bubble.outgoing::after {
        right: -0.1rem;
        border-bottom-right-radius: 0.7rem;
        transform: skew(28deg);
      }

      .cta {
        display: inline-flex;
        min-height: 3.5rem;
        margin-top: clamp(2.5rem, 7vw, 4.5rem);
        padding: 0 1.65rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #0a84ff;
        box-shadow: 0 0.85rem 2.5rem rgb(10 132 255 / 22%);
        color: white;
        font-size: 1.02rem;
        font-weight: 650;
        letter-spacing: -0.015em;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }

      .cta:hover {
        background: #0077ed;
        transform: translateY(-2px);
      }

      .cta:focus-visible {
        outline: 4px solid rgb(10 132 255 / 28%);
        outline-offset: 4px;
      }

      @media (max-width: 700px) {
        main {
          width: min(100% - 1.25rem, 32rem);
          padding-top: 2.75rem;
        }

        .examples {
          grid-template-columns: 1fr;
        }

        .thread {
          min-height: 16rem;
          padding: 0.8rem 0.8rem 1rem;
          border-radius: 1.7rem;
        }

        .thread-bar {
          min-height: 3.2rem;
        }

        .messages {
          min-height: 11rem;
          padding: 0.75rem 0.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-label="s4imsg">s4</div>
      <h1>iMessage Codex or Claude Code.</h1>
      <p class="subhead">Pick a tag. Message Codex or Claude from any conversation.</p>

      <section class="examples" aria-label="Example conversations">
        <article class="thread" data-example="codex" aria-label="Codex example">
          <div class="thread-bar" aria-hidden="true"><span class="avatar">P</span></div>
          <div class="messages">
            <p class="bubble incoming">@codex fix the failing tests</p>
            <p class="bubble outgoing">Fixed. All 42 pass.</p>
          </div>
        </article>

        <article class="thread" data-example="claude" aria-label="Claude Code example">
          <div class="thread-bar" aria-hidden="true"><span class="avatar">W</span></div>
          <div class="messages">
            <p class="bubble outgoing">@claude summarize our plan</p>
            <p class="bubble incoming">Dinner Friday. Museum Saturday.</p>
          </div>
        </article>
      </section>

      <a class="cta" href="./setup.md">Help me set up s4imsg</a>
    </main>
  </body>
</html>
