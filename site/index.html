<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <meta
      name="description"
      content="Pick any tag. iMessage Codex or Claude from any conversation."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eabnelson.github.io/s4imsg/">
    <meta property="og:title" content="s4imsg">
    <meta
      property="og:description"
      content="iMessage Codex or Claude from any conversation."
    >
    <meta property="og:image" content="https://eabnelson.github.io/s4imsg/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta
      property="og:image:alt"
      content="iMessage-style bubbles with example agent tags"
    >
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://eabnelson.github.io/s4imsg/og-image.png">
    <title>s4imsg — iMessage Codex or Claude Code</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: #f5f5f7;
      }

      main {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100vh;
        padding: clamp(1.5rem, 4vh, 3.5rem) 1rem 2rem;
        align-items: start;
        justify-items: center;
        text-align: center;
      }

      .hero {
        position: relative;
        width: min(100%, 58rem);
        padding: 0 1rem;
        isolation: isolate;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 9vw, 6rem);
        font-weight: 740;
        letter-spacing: -0.075em;
        line-height: 0.9;
      }

      .subhead {
        max-width: 42ch;
        margin: 1rem auto 0;
        color: #656569;
        font-size: clamp(1.25rem, 2.5vw, 1.6rem);
        font-weight: 470;
        letter-spacing: -0.035em;
        line-height: 1.25;
      }

      .cta {
        display: inline-flex;
        min-width: 13rem;
        min-height: 3.35rem;
        margin-top: 1.25rem;
        padding: 0 1.6rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: #0a84ff;
        box-shadow: 0 0.9rem 2.6rem rgb(10 132 255 / 24%);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 660;
        letter-spacing: -0.015em;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .cta:hover {
        background: #0077ed;
        box-shadow: 0 1rem 3rem rgb(10 132 255 / 30%);
        transform: translateY(-2px);
      }

      .cta:active {
        transform: translateY(0);
      }

      .cta:focus-visible {
        outline: 4px solid rgb(10 132 255 / 28%);
        outline-offset: 4px;
      }

      .cta[data-copied="true"] {
        background: #20a957;
        box-shadow: 0 0.9rem 2.6rem rgb(32 169 87 / 22%);
      }

      .bubble-stream {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .stream-bubble {
        position: absolute;
        left: var(--left);
        bottom: clamp(1rem, 2.5vh, 2rem);
        max-width: min(80vw, 29rem);
        opacity: 1;
        white-space: nowrap;
        animation: rise var(--duration) linear var(--delay) forwards;
        will-change: transform, opacity;
      }

      .bubble-body {
        display: block;
        max-width: 100%;
        padding: 0.72rem 1rem;
        border-radius: 999px;
        box-shadow: 0 0.8rem 2rem rgb(0 0 0 / 10%);
        font-size: clamp(0.9rem, 1.7vw, 1.08rem);
        font-weight: 520;
        letter-spacing: -0.018em;
        line-height: 1.25;
        animation:
          send-bubble-in 600ms
            linear(
              0,
              0.099 5%,
              0.3 10%,
              0.511 15%,
              0.69 20%,
              0.823 25%,
              0.912 30%,
              0.967 35%,
              0.997 40%,
              1 45%,
              1
            )
            both,
          send-bubble-opacity 200ms ease-out both;
        will-change: translate, scale, opacity;
      }

      .bubble-body.blue {
        transform-origin: right bottom;
        background: #0a84ff;
        color: white;
      }

      .bubble-body.gray {
        transform-origin: left bottom;
        background: #e5e5ea;
        color: #1d1d1f;
      }

      @keyframes send-bubble-in {
        from {
          scale: 0;
          translate: 0 80px;
        }

        to {
          scale: 1;
          translate: 0 0;
        }
      }

      @keyframes send-bubble-opacity {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(var(--rotation));
        }

        71% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--drift), -85vh, 0)
            rotate(calc(var(--rotation) + var(--spin)));
        }
      }

      @keyframes rise-mobile {
        from {
          transform: translate3d(0, 0, 0) rotate(var(--rotation));
        }

        to {
          transform: translate3d(var(--drift), -85vh, 0)
            rotate(calc(var(--rotation) + var(--spin)));
        }
      }

      @keyframes fade-before-cta {
        0%,
        72% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }

      @media (max-width: 620px) {
        .hero {
          padding-right: 0;
          padding-left: 0;
        }

        h1 {
          font-size: clamp(3.25rem, 17vw, 5rem);
        }

        .subhead {
          max-width: 23ch;
          margin-top: 1rem;
        }

        .cta {
          margin-top: 1.25rem;
        }

        .stream-bubble {
          max-width: 88vw;
          animation-name: rise-mobile, fade-before-cta;
          animation-duration: var(--duration), var(--mobile-fade-duration);
          animation-delay: var(--delay), var(--delay);
          animation-timing-function: linear, linear;
          animation-fill-mode: forwards, forwards;
        }

        .bubble-body {
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }

        .stream-bubble,
        .bubble-body {
          animation: none;
        }

        .stream-bubble[data-static="true"] {
          top: var(--top);
          bottom: auto;
          opacity: 0.22;
          transform: rotate(var(--rotation));
        }
      }
    </style>
  </head>
  <body>
    <div class="bubble-stream" data-bubble-stream aria-hidden="true"></div>

    <main>
      <section class="hero" aria-labelledby="headline">
        <h1 id="headline">Pick any tag</h1>
        <p class="subhead">iMessage Codex or Claude from any conversation</p>
        <a class="cta" id="copy-prompt" href="./setup.md" aria-live="polite">Help me get set up</a>
      </section>
    </main>

    <script>
      const setupPrompt =
        "Help me set up s4imsg: https://eabnelson.github.io/s4imsg/setup.md";
      const promptExamples = [
        "@codex fix these failing tests",
        "@claude summarize this thread",
        "@plan map out our weekend",
        "@ship draft the launch post",
        "@research compare these options",
        "@coach build me a 20-minute workout",
        "@design sketch a cleaner flow",
        "@dinner find a great spot nearby",
        "@learn explain this like I'm five",
        "@build turn this idea into a prototype",
        "@travel plan three days in Tokyo",
        "@read pull out the action items",
        "@brainstorm give me ten wild ideas",
        "@write make this sound more human",
        "@decide make a pros and cons list",
        "@gift find something they'll actually love",
        "@movie pick the perfect Friday night film",
        "@music make a playlist for this mood",
        "@recipe use what's already in my fridge",
        "@home plan a cozy weekend reset",
        "@style help me pack one great outfit",
        "@career sharpen my next big move",
        "@meeting turn this into clear next steps",
        "@party plan a tiny unforgettable dinner",
        "@photo pick the strongest shots",
        "@garden tell me what to plant this month",
        "@study quiz me until this sticks",
        "@translate keep the tone but make it clear",
        "@book find my next can't-put-it-down read",
        "@date plan something surprising nearby",
        "@kids invent a bedtime story with dragons",
        "@shop compare these without the marketing",
        "@debug explain why this keeps breaking",
        "@focus organize my chaotic afternoon",
        "@journal spot the pattern I'm missing",
        "@history give me the fascinating backstory",
        "@science fact-check this claim",
        "@launch give this idea a memorable name",
        "@roadtrip build the scenic route",
        "@cleanup turn this mess into a checklist",
        "@newsletter make this worth opening",
        "@pitch make this impossible to ignore",
        "@celebrate plan a small win properly",
        "@explore find a rabbit hole worth following",
        "@budget make this plan fit my real life",
        "@host create a menu everyone can eat",
        "@workout make this fun enough to repeat",
        "@surprise give me an idea I wouldn't expect",
      ];

      const stream = document.querySelector("[data-bubble-stream]");
      const copyButton = document.querySelector("#copy-prompt");
      const defaultCopyLabel = "Help me get set up";
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      let reducedMotion = motionPreference.matches;
      let promptIndex = 0;
      let streamTimer;
      let copyResetTimer;
      let copyAttempt = 0;

      function positionBubble(bubble) {
        const gutter = 12;
        const maxLeft = Math.max(gutter, window.innerWidth - bubble.offsetWidth - gutter);
        const left = gutter + Math.random() * (maxLeft - gutter);
        bubble.style.setProperty("--left", `${left}px`);
      }

      function updateBubbleFadeTarget(bubble) {
        const duration = Number.parseFloat(bubble.style.getPropertyValue("--duration"));
        if (!Number.isFinite(duration)) return;

        const buttonBottom = copyButton.getBoundingClientRect().bottom;
        const distanceToButton = Math.max(0, bubble.offsetTop - buttonBottom);
        const riseDistance = window.innerHeight * 0.85;
        const fadeEndProgress = Math.min(1, distanceToButton / riseDistance);
        bubble.style.setProperty(
          "--mobile-fade-duration",
          `${duration * fadeEndProgress}s`,
        );
      }

      function updateBubbleFadeTargets() {
        for (const bubble of stream.children) updateBubbleFadeTarget(bubble);
      }

      function scheduleNextBubble(delay = 850) {
        if (reducedMotion || document.hidden || streamTimer) {
          return;
        }

        streamTimer = window.setTimeout(() => {
          streamTimer = undefined;
          createBubble();
          scheduleNextBubble();
        }, delay);
      }

      function createBubble({ seed = false, staticBubble = false } = {}) {
        if (!staticBubble && stream.childElementCount >= 18) {
          stream.children[0]?.remove();
        }

        const bubble = document.createElement("span");
        const bubbleBody = document.createElement("span");
        const rotation = -16 + Math.random() * 32;
        const color = Math.random() > 0.48 ? "blue" : "gray";

        bubble.className = "stream-bubble";
        bubbleBody.className = `bubble-body ${color}`;
        bubbleBody.textContent = promptExamples[promptIndex % promptExamples.length];
        bubble.style.setProperty("--rotation", `${rotation}deg`);
        bubble.append(bubbleBody);
        promptIndex += 1;

        if (staticBubble) {
          bubble.dataset.static = "true";
          bubble.style.setProperty("--top", `${5 + Math.random() * 88}vh`);
        } else {
          const duration = (13 + Math.random() * 6) * 0.76;
          bubble.style.setProperty("--duration", `${duration}s`);
          bubble.style.setProperty(
            "--delay",
            seed ? `${-Math.random() * duration * 0.72}s` : "0s",
          );
          bubble.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          bubble.style.setProperty("--spin", `${-8 + Math.random() * 16}deg`);
          bubble.addEventListener(
            "animationend",
            (event) => {
              if (event.animationName !== "rise" && event.animationName !== "rise-mobile") return;
              bubble.remove();
              scheduleNextBubble();
            },
          );
        }

        stream.append(bubble);
        positionBubble(bubble);
        updateBubbleFadeTarget(bubble);
      }

      function initializeBubbleStream() {
        if (reducedMotion) {
          for (let index = 0; index < 8; index += 1) createBubble({ staticBubble: true });
          return;
        }

        for (let index = 0; index < 12; index += 1) createBubble({ seed: true });
        scheduleNextBubble();
      }

      function resetBubbleStream(nextReducedMotion) {
        window.clearTimeout(streamTimer);
        streamTimer = undefined;
        stream.replaceChildren();
        reducedMotion = nextReducedMotion;
        initializeBubbleStream();
      }

      initializeBubbleStream();
      motionPreference.addEventListener("change", (event) => resetBubbleStream(event.matches));
      window.addEventListener("resize", updateBubbleFadeTargets);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          window.clearTimeout(streamTimer);
          streamTimer = undefined;
        } else {
          scheduleNextBubble();
        }
      });

      async function copySetupPrompt(event) {
        event.preventDefault();
        const attempt = ++copyAttempt;
        window.clearTimeout(copyResetTimer);
        copyResetTimer = undefined;
        delete copyButton.dataset.copied;
        copyButton.textContent = "Copying prompt…";

        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(setupPrompt);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = setupPrompt;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();
            const copied = document.execCommand("copy");
            textarea.remove();
            if (!copied) throw new Error("copy failed");
          }

          if (attempt === copyAttempt) {
            copyButton.textContent = "Copied prompt";
            copyButton.dataset.copied = "true";
            copyResetTimer = window.setTimeout(() => {
              if (attempt !== copyAttempt) return;
              delete copyButton.dataset.copied;
              copyButton.textContent = defaultCopyLabel;
              copyResetTimer = undefined;
            }, 2000);
          }
        } catch {
          if (attempt === copyAttempt) {
            delete copyButton.dataset.copied;
            copyButton.textContent = "Opening setup guide…";
            window.location.assign(copyButton.href);
          }
        }
      }

      copyButton.addEventListener("click", copySetupPrompt);
    </script>
  </body>
</html>
