<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <meta
      name="description"
      content="Create as many tags as you want to iMessage Claude or Codex from any conversation."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://studiofour.io/imessage">
    <meta property="og:title" content="iMessage Tags">
    <meta
      property="og:description"
      content="iMessage Codex or Claude from any conversation."
    >
    <meta property="og:image" content="https://studiofour.io/imessage-og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta
      property="og:image:alt"
      content="iMessage-style bubbles with example agent tags"
    >
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://studiofour.io/imessage-og.png">
    <link rel="canonical" href="https://studiofour.io/imessage">
    <title>iMessage Tags — Chat with Claude or Codex</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: #f5f5f7;
      }

      main {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100vh;
        padding: clamp(1.5rem, 4vh, 3.5rem) 1rem 2rem;
        align-items: start;
        justify-items: center;
        text-align: center;
      }

      .hero {
        position: relative;
        width: min(100%, 58rem);
        padding: 0 1rem;
        isolation: isolate;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 9vw, 6rem);
        font-weight: 740;
        letter-spacing: -0.075em;
        line-height: 0.9;
      }

      .subhead {
        max-width: 42ch;
        margin: 1rem auto 0;
        color: #656569;
        font-size: clamp(1.25rem, 2.5vw, 1.6rem);
        font-weight: 470;
        letter-spacing: -0.035em;
        line-height: 1.25;
      }

      .cta {
        display: inline-flex;
        min-width: 13rem;
        min-height: 3.35rem;
        margin-top: 1.25rem;
        padding: 0 1.6rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: #0a84ff;
        box-shadow: 0 0.9rem 2.6rem rgb(10 132 255 / 24%);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 660;
        letter-spacing: -0.015em;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .cta:hover {
        background: #0077ed;
        box-shadow: 0 1rem 3rem rgb(10 132 255 / 30%);
        transform: translateY(-2px);
      }

      .cta:active {
        transform: translateY(0);
      }

      .cta:focus-visible {
        outline: 4px solid rgb(10 132 255 / 28%);
        outline-offset: 4px;
      }

      .cta[data-copied="true"] {
        background: #20a957;
        box-shadow: 0 0.9rem 2.6rem rgb(32 169 87 / 22%);
      }

      .bubble-stream {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .stream-bubble {
        position: absolute;
        left: var(--left);
        bottom: clamp(1rem, 2.5vh, 2rem);
        max-width: min(80vw, 29rem);
        opacity: 1;
        white-space: nowrap;
        will-change: transform, opacity;
      }

      .stream-bubble[data-fallback="true"] {
        animation: rise var(--duration) linear var(--delay) infinite both;
      }

      .bubble-body {
        display: block;
        max-width: 100%;
        padding: 0.72rem 1rem;
        border-radius: 999px;
        box-shadow: 0 0.8rem 2rem rgb(0 0 0 / 10%);
        font-size: clamp(0.9rem, 1.7vw, 1.08rem);
        font-weight: 520;
        letter-spacing: -0.018em;
        line-height: 1.25;
        animation: send-bubble-cycle var(--duration) linear var(--delay) infinite both;
        will-change: transform, opacity;
      }

      .bubble-body.blue {
        transform-origin: right bottom;
        background: #0a84ff;
        color: white;
      }

      .bubble-body.gray {
        transform-origin: left bottom;
        background: #e5e5ea;
        color: #1d1d1f;
      }

      @keyframes send-bubble-cycle {
        0% {
          opacity: 0;
          transform: translate3d(0, 18px, 0) scale(0.82);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        4%,
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes rise {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(var(--rotation));
        }

        71% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--drift), -85vh, 0)
            rotate(calc(var(--rotation) + var(--spin)));
        }
      }

      @media (max-width: 620px) {
        .hero {
          padding-right: 0;
          padding-left: 0;
        }

        h1 {
          font-size: clamp(3.25rem, 17vw, 5rem);
        }

        .subhead {
          max-width: 23ch;
          margin-top: 1rem;
        }

        .cta {
          margin-top: 1.25rem;
        }

        .stream-bubble {
          max-width: 88vw;
        }

        .bubble-body {
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }

        .stream-bubble,
        .bubble-body {
          animation: none;
        }

        .stream-bubble[data-static="true"] {
          top: var(--top);
          bottom: auto;
          opacity: 0.22;
          transform: rotate(var(--rotation));
        }

      }
    </style>
  </head>
  <body>
    <div class="bubble-stream" data-bubble-stream aria-hidden="true"></div>

    <main>
      <section class="hero" aria-labelledby="headline">
        <h1 id="headline">Pick any tag</h1>
        <p class="subhead">iMessage Codex or Claude from any conversation</p>
        <a class="cta" id="copy-prompt" href="https://studiofour.io/imessage-setup.md" aria-live="polite">Help me get set up</a>
      </section>
    </main>

    <script>
      const setupPrompt =
        "Help me set up iMessage Tags on this Mac. Follow https://studiofour.io/imessage-setup.md and stay with me until one tagged iMessage gets exactly one agent reply.";
      const promptExamples = [
        "@codex fix these failing tests",
        "@claude summarize this thread",
        "@plan map out our weekend",
        "@ship draft the launch post",
        "@research compare these options",
        "@coach build me a 20-minute workout",
        "@design sketch a cleaner flow",
        "@dinner find a great spot nearby",
        "@learn explain this like I'm five",
        "@build turn this idea into a prototype",
        "@travel plan three days in Tokyo",
        "@read pull out the action items",
        "@brainstorm give me ten wild ideas",
        "@write make this sound more human",
        "@decide make a pros and cons list",
        "@gift find something they'll actually love",
        "@movie pick the perfect Friday night film",
        "@music make a playlist for this mood",
        "@recipe use what's already in my fridge",
        "@home plan a cozy weekend reset",
        "@style help me pack one great outfit",
        "@career sharpen my next big move",
        "@meeting turn this into clear next steps",
        "@party plan a tiny unforgettable dinner",
        "@photo pick the strongest shots",
        "@garden tell me what to plant this month",
        "@study quiz me until this sticks",
        "@translate keep the tone but make it clear",
        "@book find my next can't-put-it-down read",
        "@date plan something surprising nearby",
        "@kids invent a bedtime story with dragons",
        "@shop compare these without the marketing",
        "@debug explain why this keeps breaking",
        "@focus organize my chaotic afternoon",
        "@journal spot the pattern I'm missing",
        "@history give me the fascinating backstory",
        "@science fact-check this claim",
        "@launch give this idea a memorable name",
        "@roadtrip build the scenic route",
        "@cleanup turn this mess into a checklist",
        "@newsletter make this worth opening",
        "@pitch make this impossible to ignore",
        "@celebrate plan a small win properly",
        "@explore find a rabbit hole worth following",
        "@budget make this plan fit my real life",
        "@host create a menu everyone can eat",
        "@workout make this fun enough to repeat",
        "@surprise give me an idea I wouldn't expect",
      ];

      const stream = document.querySelector("[data-bubble-stream]");
      const copyButton = document.querySelector("#copy-prompt");
      const defaultCopyLabel = "Help me get set up";
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      const bubbleCount = 12;
      const streamDuration = 16.8;
      const mobileBreakpoint = 620;
      const mobileFadeDistance = 100;
      const entranceEnd = 0.04;
      let reducedMotion = motionPreference.matches;
      let promptIndex = 0;
      let layoutWidth = window.innerWidth;
      let copyResetTimer;
      let copyAttempt = 0;
      const bubbleAnimations = new Map();

      function positionBubble(bubble) {
        const gutter = 12;
        const maxLeft = Math.max(gutter, window.innerWidth - bubble.offsetWidth - gutter);
        const left = gutter + Math.random() * (maxLeft - gutter);
        bubble.style.setProperty("--left", `${left}px`);
      }

      function stopBubbleAnimations() {
        for (const animation of bubbleAnimations.values()) animation.cancel();
        bubbleAnimations.clear();
      }

      function animateBubble(bubble) {
        if (typeof bubble.animate !== "function") {
          bubble.dataset.fallback = "true";
          return;
        }

        const rotation = Number.parseFloat(bubble.style.getPropertyValue("--rotation"));
        const drift = Number.parseFloat(bubble.style.getPropertyValue("--drift"));
        const spin = Number.parseFloat(bubble.style.getPropertyValue("--spin"));
        const delay = Number.parseFloat(bubble.style.getPropertyValue("--delay"));
        const mobile = window.innerWidth <= mobileBreakpoint;
        let fadeStart = 0.71;
        let fadeEnd = 1;

        if (mobile) {
          const buttonBottom = copyButton.getBoundingClientRect().bottom;
          const riseDistance = window.innerHeight * 0.85;
          const bubbleTop =
            bubble.getBoundingClientRect().top ||
            window.innerHeight - Math.max(16, window.innerHeight * 0.025) - bubble.offsetHeight;
          fadeEnd = Math.min(
            0.98,
            Math.max(
              entranceEnd + 0.02,
              (bubbleTop - buttonBottom) / riseDistance,
            ),
          );
          fadeStart = Math.max(
            entranceEnd,
            Math.min(
              fadeEnd - 0.02,
              (bubbleTop - buttonBottom - mobileFadeDistance) / riseDistance,
            ),
          );
        }

        function frame(offset, opacity) {
          return {
            offset,
            opacity,
            transform: `translate3d(${drift * offset}px, ${-85 * offset}vh, 0) rotate(${rotation + spin * offset}deg)`,
          };
        }

        const keyframes = [
          frame(0, 1),
          frame(fadeStart, 1),
          frame(fadeEnd, 0),
        ];
        if (fadeEnd < 1) keyframes.push(frame(1, 0));

        const animation = bubble.animate(keyframes, {
          delay: delay * 1_000,
          duration: streamDuration * 1_000,
          easing: "linear",
          fill: "both",
          iterations: Number.POSITIVE_INFINITY,
        });
        bubbleAnimations.set(bubble, animation);
      }

      function createBubble({ streamIndex, staticBubble = false } = {}) {

        const bubble = document.createElement("span");
        const bubbleBody = document.createElement("span");
        const rotation = -16 + Math.random() * 32;
        const color = Math.random() > 0.48 ? "blue" : "gray";

        bubble.className = "stream-bubble";
        bubbleBody.className = `bubble-body ${color}`;
        bubbleBody.textContent = promptExamples[promptIndex % promptExamples.length];
        bubble.style.setProperty("--rotation", `${rotation}deg`);
        bubble.append(bubbleBody);
        promptIndex += 1;

        if (staticBubble) {
          bubble.dataset.static = "true";
          bubble.style.setProperty("--top", `${5 + Math.random() * 88}vh`);
        } else {
          const delay = ((streamIndex ?? 0) * streamDuration) / bubbleCount;
          bubble.style.setProperty("--duration", `${streamDuration}s`);
          bubble.style.setProperty(
            "--delay",
            streamIndex === 0 ? "0s" : `${delay}s`,
          );
          bubble.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          bubble.style.setProperty("--spin", `${-8 + Math.random() * 16}deg`);
          bubbleBody.addEventListener("animationiteration", () => {
            bubbleBody.textContent = promptExamples[promptIndex % promptExamples.length];
            promptIndex += 1;
            positionBubble(bubble);
          });
        }

        stream.append(bubble);
        positionBubble(bubble);
        if (!staticBubble) animateBubble(bubble);
      }

      function initializeBubbleStream() {
        if (reducedMotion) {
          for (let index = 0; index < 8; index += 1) createBubble({ staticBubble: true });
          return;
        }

        for (let index = 0; index < bubbleCount; index += 1) {
          createBubble({ streamIndex: index });
        }
      }

      function resetBubbleStream(nextReducedMotion) {
        stopBubbleAnimations();
        stream.replaceChildren();
        reducedMotion = nextReducedMotion;
        layoutWidth = window.innerWidth;
        initializeBubbleStream();
      }

      function handleResize() {
        if (window.innerWidth === layoutWidth) return;
        resetBubbleStream(reducedMotion);
      }

      initializeBubbleStream();
      motionPreference.addEventListener("change", (event) => resetBubbleStream(event.matches));
      window.addEventListener("resize", handleResize);

      async function copySetupPrompt(event) {
        event.preventDefault();
        const attempt = ++copyAttempt;
        window.clearTimeout(copyResetTimer);
        copyResetTimer = undefined;
        delete copyButton.dataset.copied;
        copyButton.textContent = "Copying prompt…";

        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(setupPrompt);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = setupPrompt;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();
            const copied = document.execCommand("copy");
            textarea.remove();
            if (!copied) throw new Error("copy failed");
          }

          if (attempt === copyAttempt) {
            copyButton.textContent = "Copied prompt";
            copyButton.dataset.copied = "true";
            copyResetTimer = window.setTimeout(() => {
              if (attempt !== copyAttempt) return;
              delete copyButton.dataset.copied;
              copyButton.textContent = defaultCopyLabel;
              copyResetTimer = undefined;
            }, 2000);
          }
        } catch {
          if (attempt === copyAttempt) {
            delete copyButton.dataset.copied;
            copyButton.textContent = "Opening setup guide…";
            window.location.assign(copyButton.href);
          }
        }
      }

      copyButton.addEventListener("click", copySetupPrompt);
    </script>
  </body>
</html>
