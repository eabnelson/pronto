name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: packages/slack/native/go.mod
          cache-dependency-path: packages/slack/native/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Check native helper vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: packages/slack/native
      - run: bun run build
      - run: codesign --verify --strict --verbose=4 dist/pronto
      - run: bun test
      - run: go test ./...
        working-directory: packages/slack/native
      - run: bun run release:validate
      - run: swift test --package-path apps/menubar
      - run: apps/menubar/scripts/bundle.sh "$RUNNER_TEMP/menubar"
